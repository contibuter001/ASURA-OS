id: power-huawei
name: "Huawei MateBook Battery Protection"
description: "Persists battery charge threshold (40-80%) via huawei-wmi driver"
layer: component

match:
  module:
    - "huawei_wmi"

packages: []

kernel_parameters: []

files:
  udev:
    - target: "/etc/udev/rules.d/99-huawei-battery.rules"
      content: |
        # Huawei battery charge protection threshold (stop at 80%, start at 40%)
        SUBSYSTEM=="platform", DRIVERS=="huawei-wmi", ATTR{charge_thresholds}="40 80"
      reason: "Persist battery charge threshold on Huawei laptops (Linux kernel Documentation/ABI/testing/sysfs-platform-huawei-wmi)"

services: []

notes:
  - "Knowledge source: Linux kernel Documentation/ABI/testing/sysfs-platform-huawei-wmi."
  - "Configures battery health limits via the kernel huawei-wmi platform driver."
