id: lg-gram
name: "LG Gram Laptops"
description: "LG Gram ultralight hardware profile: lg-laptop battery care limit and silent fan mode"
layer: vendor

match:
  sys_vendor: "LG Electronics"
  chassis: "laptop"

packages: []

kernel_parameters: []

files:
  udev:
    - target: "/etc/udev/rules.d/99-lg-battery.rules"
      content: |
        # LG battery care limit (80%)
        SUBSYSTEM=="power_supply", KERNEL=="BAT[0-9]", ATTR{charge_control_end_threshold}="80"
      reason: "Persist 80% battery care threshold on LG Gram (Linux drivers/platform/x86/lg-laptop.c)"

services: []

notes:
  - "Knowledge source: Linux kernel drivers/platform/x86/lg-laptop.c."
  - "LG Battery Care Limit caps battery charge at 80%."
  - "Reader mode and silent fan control supported through lg-laptop driver."
