name: xbps-repo

# ASURA's XBPS repository: the `asura` package (everything apply-repo.sh
# installs) and its index.
#
# - Every pull request and push builds the package and installs it in a clean
#   Void container, so a change that breaks the package fails here.
# - A dev-unstable commit is published only after the ci workflow passed on it
#   (the rule asura update follows), and only when the XBPS_SIGNING_KEY secret
#   exists: an unsigned repository is never published. It is served by GitHub
#   Pages at https://<owner>.github.io/<repo>/current (docs/package-repo.md).

on:
  pull_request:
    branches: [main, dev-unstable]
    paths:
      - 'packaging/xbps/**'
      - 'installation/apply-repo.sh'
      - '.github/workflows/xbps-repo.yml'
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [dev-unstable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xbps-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: XBPS — build and install the package
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    env:
      HAS_KEY: ${{ secrets.XBPS_SIGNING_KEY != '' }}
    steps:
      - name: Checkout the commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0   # the package version counts the branch's commits

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Stage everything an update installs
        run: |
          sh installation/apply-repo.sh --no-packages . build/stage
          test -x build/stage/usr/bin/asura

      - name: Write the signing key
        if: env.HAS_KEY == 'true'
        env:
          XBPS_SIGNING_KEY_PEM: ${{ secrets.XBPS_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$XBPS_SIGNING_KEY_PEM" > build/signing-key.pem

      - name: Build the package and the index (Void container)
        run: |
          key=""
          [ -f build/signing-key.pem ] && key=/workspace/build/signing-key.pem
          docker run --rm -v "$PWD":/workspace -w /workspace -e XBPS_SIGNING_KEY="$key" \
            ghcr.io/void-linux/void-glibc-full:latest sh -euc '
              xbps-install -Syu xbps >/dev/null && xbps-install -y git >/dev/null
              git config --global --add safe.directory /workspace
              sh packaging/xbps/build-repo.sh build/repo/current build/stage'
          rm -f build/signing-key.pem
          sudo chown -R "$(id -u):$(id -g)" build

      - name: Install the package in a clean Void container
        run: |
          docker run --rm -v "$PWD/build/repo/current":/repo:ro \
            ghcr.io/void-linux/void-glibc-full:latest sh -euc '
              xbps-install -Syu xbps >/dev/null
              xbps-install -Sy \
                --repository=/repo \
                --repository=https://raw.githubusercontent.com/Makrennel/hyprland-void/repository-x86_64-glibc/ \
                asura
              xbps-query asura | sed -n "s/^pkgver: //p"
              test -x /usr/bin/asura
              test -f /usr/share/asura/shell-desktop/shell.qml
              /usr/bin/asura version'

      - name: Upload the repository
        uses: actions/upload-artifact@v6
        with:
          name: asura-xbps-repo
          path: build/repo/
          if-no-files-found: error
          retention-days: 7

      - name: Upload the repository for Pages
        if: github.event_name == 'workflow_run' && env.HAS_KEY == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/repo/

  publish:
    name: XBPS — publish to GitHub Pages
    needs: build
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    env:
      HAS_KEY: ${{ secrets.XBPS_SIGNING_KEY != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}current
    steps:
      - name: Say why nothing is published
        if: env.HAS_KEY != 'true'
        run: echo "XBPS_SIGNING_KEY is not set, so nothing is published (docs/package-repo.md)"
      - name: Deploy
        id: deploy
        if: env.HAS_KEY == 'true'
        uses: actions/deploy-pages@v4
